<style>
    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
        font-family: Arial, sans-serif;
        color: #000;
        background: url("../Photos/Fond écran.png") repeat;
    }

    /* Filets dorés horizontaux */
    .filet-dore {
        height: 2px;
        background: #CC9900;
        width: 100%;
    }

    .espace-fin { height: 2px; }
    .espace-large { height: 10px; }
    .espace-tres-large { height: 30px; }
    .espace-extra-large { height: 80px; }


    /* EN-TÊTE : 20% / 60% / 20%.
       Le titre est confiné à la colonne centrale et ne peut pas passer sous Facebook. */
    .entete {
        display: grid;
        grid-template-columns: 20% 60% 20%;
        align-items: center;
        min-height: 110px;
        padding: 3px 0;
    }

    .entete-case {
        display: flex;
        justify-content: center;
        align-items: center;
        min-width: 0;
    }

    .entete-case img { display: block; }

    .titre-oscillant {
        width: 100%;
        height: 80px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
    }

    #titrePionForgeron {
        position: absolute;
        left: 0;
        top: 50%;
        white-space: nowrap;
        transform: translate(0, -50%);
        font-family: Arial, sans-serif;
        font-size: clamp(50px, 4vw, 50px);
        font-weight: bold;
        font-style: italic;
        color: #990000;
    }

 /* Passage souris sur images "facebook" et "Embleme"  */
    .facebook, .Embleme {
        display: inline-block;
        border: 2px solid transparent;
        transition: transform .25s ease, border-color .25s ease;
    }

    .facebook:hover, .Embleme:hover {
        border-color: #990000;
        transform: scale(1.08);
    }
 

    /* CORPS : menu + zone principale */
    .corps {
        display: grid;
        grid-template-columns: 150px 3px 3px 3px minmax(0, 1fr);
        align-items: stretch;
        width: 100%;
    }

    /* Deux filets dorés verticaux séparant le menu de la zone centrale. */
    .separateur-dore-vertical {
        background: #CC9900;
        min-height: 100%;
    }

    .separateur-vide { background: transparent; }

    .menu {
        text-align: center;
        padding-top: 5px;
    }

    .menu a {
        display: block;
        width: max-content;
        margin: 0 auto 18px auto;
        line-height: 0;
    }

    .menu img {
        display: block;
        height: auto;
        border: 1px solid #000;
    }

    /* Le bouton "page en cours" est volontairement plus large que les autres avec cadre rouge spécifique */
    .menu .bouton-page {
        width: 130px ;
        border: 4px solid #990000 ;
    }

    .menu .bouton-standard {
        width: 110px;
	border: 1px solid black ;
    }

  /* Passage souris sur les boutons du menu */
   .Presentation, .Archives, .Saison-2025-2026, .Membres-2025-2026, .Tournois-2025-2026, .Stands-2025-2026, .Halloween-2025-2026, .Noel-2025-2026, .Crepes-2025-2026, .Valentin-2025-2026, .Nuit-2025-2026, .Triclub-2025-2026, .Mentions{
        display: inline-block;
        border: 1px solid transparent;
        transition: transform .25s ease, border-color .25s ease;
    }

   .Presentation:hover, .Archives:hover/*, .Saison-2025-2026:hover*/, .Membres-2025-2026:hover, .Tournois-2025-2026:hover, .Stands-2025-2026:hover/*, .Halloween-2025-2026:hover*/, .Noel-2025-2026:hover, .Crepes-2025-2026:hover, .Valentin-2025-2026:hover, .Nuit-2025-2026:hover, .Triclub-2025-2026:hover, .Mentions:hover {
         border: 2px solid #990000;
        transform: scale(1.06);
    }

  .menu .mentions {
        margin-top: 20px;
    }

    /* Zone fenêtre principale */
    .fenetre {
        min-width: 0;
        padding: 0 0 8px 0;
    }

    .grille-fenetre-1 {
        display: grid;
        grid-template-columns: 100%  minmax(0, 1fr);
        width: 100%;
        align-items: start;
        font-family: Arial, sans-serif;
        font-size: clamp(25px, 4vw, 40px);
        font-weight: bold;
        font-style: italic;
    }

    .grille-fenetre-2 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
        align-items: start;
        font-family: Arial, sans-serif;
        font-size: clamp(25px, 4vw, 40px);
        font-weight: bold;
        font-style: italic;
    }

    .case-fenetre-1, .case-fenetre-2 {
        min-width: 0;
        text-align: center;
        padding: 10px 8px;
        border-bottom: 2px solid transparent;
    }

    /* Deux filets transparents verticaux entre les trois colonnes. */
    .case-resultat:nth-child(3n+2),
    .case-resultat:nth-child(3n+3) {
        border-left: 2px solid transparent;
    }
							
    .case-fenetre-1 img {
        display: inline-block;
        height: auto;
        max-width: 70%;
        /*  border: 5px solid blue;*/
        border: 1px solid black;
    }

    .case-fenetre-2 img {
        display: inline-block;
        height: auto;
        max-width: 93%;
        /* border: 5px solid #A349A4;*/
    }

     .fenetre img { width: 95%; }

    /* Sur petit écran, les colonnes se réduisent progressivement. */
    @media (max-width: 1000px) {
        .entete { grid-template-columns: 25% 50% 25%; }
        .corps { grid-template-columns: 105px 2px 2px 2px minmax(0, 1fr); }
        .menu .bouton-standard { width: 90px; }
        .menu .bouton-page { width: 100px ; }
	.grille-fenetre-1 {font-size: clamp(25px, 4vw, 20px);}
        .case-fenetre-1 img {max-width: 95%;}
        .case-fenetre-2 img {max-width: 95%;}
       #titrePionForgeron {font-size: clamp(15px, 4vw, 50px); }
    }

    @media (max-width: 700px) {
        .entete { grid-template-columns: 1fr 2fr 1fr; }
        .entete-case img { max-width: 90px; }
        .corps { grid-template-columns: 100px 2px 2px 2px minmax(0, 1fr); }
        .menu .bouton-standard { width: 88px; }
        .menu .bouton-page { width: 95px ; }
        .grille-fenetre-1 { grid-template-columns: 1fr; }
        .grille-fenetre-2 { grid-template-columns: 1fr; }
        .case-fenetre-1 img {max-width: 100%;}
        .case-fenetre-1:nth-child(3n+2),
        .case-fenetre-1:nth-child(3n+3) {
            border-left: 0;
            border-bottom: 2px solid transparent;
        }
        .case-fenetre-2 img {max-width: 100%;}
        .case-fenetre-2:nth-child(3n+2),
        .case-fenetre-2:nth-child(3n+3) {
            border-left: 0;
            border-bottom: 2px solid transparent;
        }

    }
</style>
